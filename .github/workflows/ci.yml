name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./data/studiolog.db
          BETTER_AUTH_SECRET: ci-test-secret-please-override-locally-123456
